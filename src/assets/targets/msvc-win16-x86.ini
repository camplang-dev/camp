[target]
name=msvc-win16-x86

[define]
MSVC=1
WINDOWS=1
WIN16=1
X86=1

[callspec]
_cdecl=__cdecl
_stdcall=__stdcall
_fastcall=__fastcall
_pascal=__pascal
_winapi=__stdcall

[typespec]
_near=__near
_far=__far
_huge=__huge

[ctype]
sbyte=signed char
byte=unsigned char
short=int
ushort=unsigned int
int=long int
uint=unsigned long int
long=<unsupported>
ulong=<unsupported>
nint=int
nuint=unsigned int
float=float
double=double
bool=int
char=char
wchar=unsigned short
uchar=unsigned long int
achar=char

[nint]
_near=16
_far=16
_huge=32

[pointer]
_near=16
_far=32
_huge=32

[memorymodel]
tiny=_near/_near
small=_near/_near
medium=_far/_near
compact=_near/_far
large=_far/_far
huge=_far/_huge
