[target]
name=c99
include=stdint.h stdbool.h

[define]
C99=1

[capability]
c_source_ext=.c

[ctype]
sbyte=int8_t
byte=uint8_t
short=int16_t
ushort=uint16_t
int=int32_t
uint=uint32_t
long=int64_t
ulong=uint64_t
nint=intptr_t
nuint=uintptr_t
float=float
double=double
bool=bool
char=char
achar=char
wchar=uint16_t
uchar=uint32_t

[artifact]
object_ext=.o
exec_prefix=
exec_ext=
static_prefix=lib
static_ext=.a
shared_prefix=lib
shared_ext=.so

[build]
compile={cc} -std=c99 {profile_cflags} {build_cflags} -c {source} -o {object}
exec={cc} {objects} {libs} -o {output} {profile_ldflags}
static={ar} rcs {output} {objects} {libs}
shared={cc} -shared {objects} {libs} -o {output} {profile_ldflags}

[profile.DEBUG]
cflags=-g
ldflags=

[profile.RELEASE]
cflags=-O2
ldflags=
