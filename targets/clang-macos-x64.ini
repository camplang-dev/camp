[target]
name=clang-macos-x64
base=c99

[ctype]
int=int

[define]
CLANG=1
MACOS=1
POSIX=1
X64=1

[configure]
OS_MACOSX=true
SUBSYSTEM_POSIX=true
SUBSYSTEM_DARWIN=true
ARCH_X64=true

[capability]
platform=macos
compiler=clang
supports_frameworks=true
supports_objc=true
objc_source_ext=.m
wstring_prefix=u

[callspec]
_cdecl=
_sysv=__attribute__((sysv_abi))
_msabi=__attribute__((ms_abi))

[toolchain]
cc=clang
ar=ar

[artifact]
shared_ext=.dylib

[build]
compile={cc} -std=c11 {profile_cflags} {build_cflags} -c {source} -o {object}
shared={cc} -dynamiclib {objects} {libs} -o {output} {profile_ldflags}

[cemit]
dll_export_prefix=__attribute__((visibility("default")))
shared_cflags=-fvisibility=hidden
