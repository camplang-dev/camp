[target]
name=wasm32-wasi
base=c99

[define]
WASM=1
WASI=1
NO_TIMERS=1
NO_FILES=1

[configure]
OS_WASI=true
ARCH_WASM32=true
SUPPORTS_FILES=false
SUPPORTS_TIMERS=false

[capability]
platform=wasi
compiler=clang
supports_frameworks=false
supports_objc=false
wstring_prefix=u

[nint]
default=32

[pointer]
default=32

[toolchain]
cc=/opt/wasi-sdk/bin/clang
ar=/opt/wasi-sdk/bin/llvm-ar

[artifact]
exec_ext=.wasm
static_prefix=lib
static_ext=.a
shared_prefix=
shared_ext=.wasm

[build]
compile={cc} --target=wasm32-wasi -std=c11 {profile_cflags} {build_cflags} -c {source} -o {object}
exec={cc} --target=wasm32-wasi {objects} {libs} -o {output} {profile_ldflags}
static={ar} rcs {output} {objects} {libs}
shared={cc} --target=wasm32-wasi {objects} {libs} -o {output} {profile_ldflags}

[profile.DEBUG]
cflags=-g
ldflags=

[profile.RELEASE]
cflags=-O2
ldflags=
