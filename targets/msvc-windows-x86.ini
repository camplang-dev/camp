[target]
name=msvc-windows-x86
base=windows
include=string.h

[define]
MSVC=1
WIN32=1
X86=1

[variant]
charwidth=ansi unicode*

[define:unicode]
UNICODE=1
_UNICODE=1

[capability]
compiler=msvc
wstring_prefix=(const uint16_t*)L

[callspec]
_cdecl=__cdecl
_stdcall=__stdcall
_fastcall=__fastcall
_thiscall=__thiscall
_winapi=__stdcall

[typespec]
_near=
_far=
_huge=

[toolchain]
cc=cl
ar=lib
msvc_arch=x86

[artifact]
object_ext=.obj
exec_ext=.exe
static_prefix=
static_ext=.lib
shared_prefix=
shared_ext=.dll
shared_import_prefix=
shared_import_ext=.lib

[build]
compile={cc} /nologo /TC {profile_cflags} {build_cflags} /c {source} /Fo{object}
exec={cc} /nologo {objects} {libs} /Fe{output} {profile_ldflags}
winexe={cc} /nologo {objects} {libs} user32.lib kernel32.lib gdi32.lib /Fe{output} {profile_ldflags} /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup
static={ar} /nologo /OUT:{output} {objects} {libs}
shared={cc} /nologo /LD {objects} {libs} user32.lib kernel32.lib gdi32.lib /Fe{output} {profile_ldflags} /link /IMPLIB:{import_library}

[cemit]
dll_export_prefix=__declspec(dllexport)
dll_import_prefix=__declspec(dllimport)
shared_cflags=
alloca=_alloca
memcpy=memcpy
memmove=memmove
memset=memset

[profile.DEBUG]
cflags=/Zi
ldflags=

[profile.DEBUG:unicode]
cflags=/Zi /DUNICODE /D_UNICODE
ldflags=

[profile.RELEASE]
cflags=/O2
ldflags=

[profile.RELEASE:unicode]
cflags=/O2 /DUNICODE /D_UNICODE
ldflags=
