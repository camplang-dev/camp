[target]
name=gcc-linux-x64
base=c99

[define]
GCC=1
LINUX=1
POSIX=1
X64=1

[callspec]
_cdecl=
_sysv=__attribute__((sysv_abi))
_msabi=__attribute__((ms_abi))

[nint]
default=64

[pointer]
default=64

[toolchain]
cc=gcc
ar=ar

[cemit]
dll_export_prefix=__attribute__((visibility("default")))
shared_cflags=-fvisibility=hidden

[profile.DEBUG]
cflags=-g -m64
ldflags=-m64

[profile.RELEASE]
cflags=-O2 -m64
ldflags=-m64
