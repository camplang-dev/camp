[target]
name=gcc-linux-x86
base=c99

[define]
GCC=1
LINUX=1
POSIX=1
X86=1

[configure]
OS_LINUX=true
SUBSYSTEM_POSIX=true
ARCH_X86=true

[capability]
platform=linux
compiler=gcc
supports_frameworks=false
supports_objc=false
wstring_prefix=u

[callspec]
_cdecl=
_sysv=__attribute__((sysv_abi))

[nint]
default=32

[pointer]
default=32

[toolchain]
cc=gcc
ar=ar

[build]
compile={cc} -std=c11 {profile_cflags} {build_cflags} -c {source} -o {object}

[cemit]
dll_export_prefix=__attribute__((visibility("default")))
shared_cflags=-fvisibility=hidden

[profile.DEBUG]
cflags=-g -m32
ldflags=-m32

[profile.RELEASE]
cflags=-O2 -m32
ldflags=-m32
