[target]
name=gcc-linux-x86
base=c99

[define]
GCC=1
LINUX=1
POSIX=1
X86=1

[callspec]
_cdecl=
_sysv=__attribute__((sysv_abi))

[nint]
default=32

[pointer]
default=32

[toolchain]
cc=gcc
ar=ar

[cemit]
dll_export_prefix=__attribute__((visibility("default")))
shared_cflags=-fvisibility=hidden

[profile.DEBUG]
cflags=-g -m32
ldflags=-m32

[profile.RELEASE]
cflags=-O2 -m32
ldflags=-m32
