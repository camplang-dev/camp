[target]
name=msvc-win16-x86

[define]
MSVC=1
WINDOWS=1
WIN16=1
X86=1

[capability]
platform=windows
compiler=msvc
supports_frameworks=false
supports_objc=false
c_source_ext=.c

[callspec]
_cdecl=__cdecl
_stdcall=__stdcall
_fastcall=__fastcall
_pascal=__pascal
_winapi=__stdcall

[typespec]
_near=__near
_far=__far
_huge=__huge

[conversion.data_pointer]
_near->_far=implicit
_near->_huge=implicit
_far->_huge=implicit
_far->_near=unsafe
_huge->_far=unsafe
_huge->_near=unsafe

[conversion.function_pointer]
_near->_far=explicit
_near->_huge=explicit
_far->_huge=explicit
_far->_near=unsafe
_huge->_far=unsafe
_huge->_near=unsafe

[conversion.nint]
_near->_far=implicit
_near->_huge=implicit
_far->_huge=implicit
_far->_near=unsafe
_huge->_far=unsafe
_huge->_near=unsafe

[conversion.abi_slot]
_near->_far=compatible
_near->_huge=compatible
_far->_huge=compatible

[ctype]
sbyte=signed char
byte=unsigned char
short=int
ushort=unsigned int
int=long int
uint=unsigned long int
long=<unsupported>
ulong=<unsupported>
nint=int
nuint=unsigned int
float=float
double=double
bool=int
char=char
wchar=unsigned short
uchar=unsigned long int
achar=char

[nint]
_near=16
_far=16
_huge=32

[pointer]
_near=16
_far=32
_huge=32

[memorymodel]
tiny=_near/_near
small=_near/_near
medium=_far/_near
compact=_near/_far
large=_far/_far
huge=_far/_huge

[toolchain]
cc=cl
ar=lib

[artifact]
object_ext=.obj
exec_ext=.exe
static_prefix=
static_ext=.lib
shared_prefix=
shared_ext=.dll

[build]
compile={cc} /nologo /TC {profile_cflags} {build_cflags} /c {source} /Fo{object}
exec={cc} /nologo {objects} {libs} /Fe{output} {profile_ldflags}
static={ar} /nologo /OUT:{output} {objects} {libs}
shared={cc} /nologo /LD {objects} {libs} /Fe{output} {profile_ldflags}

[profile.DEBUG]
cflags=/Zi
ldflags=

[profile.RELEASE]
cflags=/O2
ldflags=
