[target]
name=wasm32-emscripten
base=c99

[define]
WASM=1
EMSCRIPTEN=1
NO_TIMERS=1
NO_FILES=1

[capability]
platform=emscripten
compiler=emcc
supports_frameworks=false
supports_objc=false
wstring_prefix=u

[nint]
default=32

[pointer]
default=32

[toolchain]
cc=/opt/emsdk/upstream/emscripten/emcc
ar=/opt/emsdk/upstream/emscripten/emar

[artifact]
exec_ext=.js
static_prefix=lib
static_ext=.a
shared_prefix=
shared_ext=.wasm

[build]
compile={cc} -std=c11 {profile_cflags} {build_cflags} -c {source} -o {object}
exec={cc} {objects} {libs} -o {output} {profile_ldflags}
static={ar} rcs {output} {objects} {libs}
shared={cc} -sSIDE_MODULE=1 {objects} {libs} -o {output} {profile_ldflags}

[profile.DEBUG]
cflags=-g
ldflags=

[profile.RELEASE]
cflags=-O2
ldflags=-O2
