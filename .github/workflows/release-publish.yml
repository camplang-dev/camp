name: release-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v0.1.0-preview.1
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-x86
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev build-essential

      - name: Build
        run: dotnet build src/camplang.sln

      - name: Run targeted tests
        shell: bash
        run: |
          dotnet vstest src/Camp.Compiler.TestRunner/bin/Debug/net10.0/Camp.Compiler.TestRunner.dll \
            --TestCaseFilter:"FullyQualifiedName~CommandLineTests|FullyQualifiedName~ProjectLoaderTests|FullyQualifiedName~LspServerTests|FullyQualifiedName~DapServerTests"

      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: local/package-release.sh --version "${{ steps.version.outputs.value }}" --rid "${{ matrix.rid }}" --output-dir artifacts

      - name: Package release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./local/package-release.ps1 -Version "${{ steps.version.outputs.value }}" -Rid "${{ matrix.rid }}" -OutputDir artifacts

      - name: Smoke test archive
        if: runner.os != 'Windows'
        shell: bash
        run: local/test-release-archive.sh artifacts/camp-${{ steps.version.outputs.value }}-${{ matrix.rid }}.tar.gz

      - name: Smoke test archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./local/test-release-archive.ps1 artifacts/camp-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: camp-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: |
            artifacts/camp-${{ steps.version.outputs.value }}-${{ matrix.rid }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          cd release-assets
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done
          cat *.sha256 | sort > checksums.txt

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          notes="Camp ${version} preview release."
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" release-assets/* --clobber
          else
            gh release create "$version" release-assets/* --prerelease --title "Camp ${version}" --notes "$notes"
          fi
