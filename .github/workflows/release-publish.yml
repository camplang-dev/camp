name: release-publish
run-name: ${{ inputs.version }} release publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
      publish:
        description: I understand this will create the tag and publish release assets
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    name: validate release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs and release notes
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"

          if [ "${{ inputs.publish }}" != "true" ]; then
            echo "The publish checkbox must be enabled to publish a release." >&2
            exit 1
          fi

          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "Release version must look like v0.2.0-preview.1 or v1.0.0." >&2
            exit 1
          fi

          notes="docs/releases/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "Release notes file is missing: $notes" >&2
            exit 1
          fi

          first_line="$(sed -n '1p' "$notes")"
          if [[ "$first_line" == \#* ]]; then
            echo "Release notes must not start with a Markdown heading; GitHub renders the release title separately." >&2
            exit 1
          fi

          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$version")"
            head_commit="$(git rev-parse HEAD)"
            if [ "$tag_commit" != "$head_commit" ]; then
              echo "Tag $version already exists at $tag_commit, but this workflow is running at $head_commit." >&2
              echo "Choose a new version or delete the existing tag intentionally before publishing." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            test: true
            smoke: true
          - rid: win-x86
            runner: windows-latest
            test: true
            smoke: true
          - rid: linux-x64
            runner: ubuntu-latest
            test: true
            smoke: true
          - rid: osx-x64
            runner: macos-15
            test: false
            smoke: false
          - rid: osx-arm64
            runner: macos-15
            test: false
            smoke: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev build-essential

      - name: Build
        run: dotnet build src/camplang.sln

      - name: Run targeted tests
        if: matrix.test
        shell: bash
        run: |
          dotnet vstest src/Camp.Compiler.TestRunner/bin/Debug/net10.0/Camp.Compiler.TestRunner.dll \
            --TestCaseFilter:"FullyQualifiedName~CommandLineTests|FullyQualifiedName~ProjectLoaderTests|FullyQualifiedName~SyntaxHighlightingFilesTests|FullyQualifiedName~LspServerTests|FullyQualifiedName~DapServerTests"

      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: .github/scripts/release/package-release.sh --version "${{ needs.validate.outputs.version }}" --rid "${{ matrix.rid }}" --output-dir artifacts

      - name: Package release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/release/package-release.ps1 -Version "${{ needs.validate.outputs.version }}" -Rid "${{ matrix.rid }}" -OutputDir artifacts

      - name: Smoke test archive
        if: runner.os != 'Windows' && matrix.smoke
        shell: bash
        run: .github/scripts/release/test-release-archive.sh artifacts/camp-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.tar.gz

      - name: Smoke test archive
        if: runner.os == 'Windows' && matrix.smoke
        shell: pwsh
        run: ./.github/scripts/release/test-release-archive.ps1 artifacts/camp-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: camp-${{ needs.validate.outputs.version }}-${{ matrix.rid }}
          path: |
            artifacts/camp-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error

  publish:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release notes
        shell: bash
        run: |
          notes="docs/releases/${{ needs.validate.outputs.version }}.md"
          if [ ! -f "$notes" ]; then
            echo "Release notes file is missing: $notes" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          cd release-assets
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done
          cat *.sha256 | sort > checksums.txt

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.validate.outputs.version }}"
          commit="${{ needs.validate.outputs.commit }}"
          notes="docs/releases/${version}.md"

          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            git tag "$version" "$commit"
            git push origin "$version"
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            gh release edit "$version" --title "Camp ${version}" --notes-file "$notes" --latest
            gh release upload "$version" release-assets/* --clobber
          else
            gh release create "$version" release-assets/* --latest --title "Camp ${version}" --notes-file "$notes"
          fi

  verify-install:
    needs:
      - validate
      - publish
    name: verify install (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            shell: bash
          - name: osx-x64
            runner: macos-15
            shell: bash
          - name: win-x64
            runner: windows-latest
            shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Verify Unix installer
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)/camp"
          version="${{ needs.validate.outputs.version }}"
          install_output="$(sh install.sh --version "$version" --install-dir "$install_dir" --no-path)"
          echo "$install_output"
          echo "$install_output" | grep -F "extras/editors/vscode/install.sh"
          echo "$install_output" | grep -F "extras/editors/sublime/install.sh"
          echo "$install_output" | grep -F "extras/editors/micro/install.sh"
          echo "$install_output" | grep -F "extras/editors/vim/install.sh"
          "$install_dir/bin/campc" --version
          for attempt in 1 2 3 4 5 6; do
            if latest_output="$(sh install.sh --dry-run --no-path 2>&1)" && echo "$latest_output" | grep -F "Camp $version"; then
              echo "$latest_output"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "$latest_output"
              echo "Latest release resolution did not select $version." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify Windows installer
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $installDir = Join-Path $env:RUNNER_TEMP "camp-install"
          $installText = (& ./install.ps1 -Version $version -InstallDir $installDir -NoPath 6>&1 | Out-String)
          $installText
          foreach ($expected in @(
            "extras\editors\vscode\install.ps1",
            "extras\editors\sublime\install.ps1",
            "extras\editors\micro\install.ps1",
            "extras\editors\vim\install.ps1"
          )) {
            if (-not $installText.Contains($expected)) {
              throw "Installer output did not mention $expected."
            }
          }
          & (Join-Path $installDir "bin\campc.exe") --version
          $latestText = ""
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $latestText = (& ./install.ps1 -DryRun -NoPath 6>&1 | Out-String)
              if ($latestText.Contains("Camp $version")) {
                $latestText
                break
              }
            }
            catch {
              $latestText = $_ | Out-String
            }
            if ($attempt -eq 6) {
              $latestText
              throw "Latest release resolution did not select $version."
            }
            Start-Sleep -Seconds 10
          }
