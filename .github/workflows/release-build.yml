name: release-build
run-name: ${{ inputs.version }} release rehearsal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            test: true
            smoke: true
          - rid: win-x86
            runner: windows-latest
            test: true
            smoke: true
          - rid: linux-x64
            runner: ubuntu-latest
            test: true
            smoke: true
          - rid: osx-x64
            runner: macos-15
            test: false
            smoke: false
          - rid: osx-arm64
            runner: macos-15
            test: false
            smoke: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev build-essential

      - name: Build
        run: dotnet build src/camplang.sln

      - name: Run targeted tests
        if: matrix.test
        shell: bash
        run: |
          dotnet vstest src/Camp.Compiler.TestRunner/bin/Debug/net10.0/Camp.Compiler.TestRunner.dll \
            --TestCaseFilter:"FullyQualifiedName~CommandLineTests|FullyQualifiedName~ProjectLoaderTests|FullyQualifiedName~SyntaxHighlightingFilesTests|FullyQualifiedName~LspServerTests|FullyQualifiedName~DapServerTests"

      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: .github/scripts/release/package-release.sh --version "${{ inputs.version }}" --rid "${{ matrix.rid }}" --output-dir artifacts

      - name: Package release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/release/package-release.ps1 -Version "${{ inputs.version }}" -Rid "${{ matrix.rid }}" -OutputDir artifacts

      - name: Smoke test archive
        if: runner.os != 'Windows' && matrix.smoke
        shell: bash
        run: .github/scripts/release/test-release-archive.sh artifacts/camp-${{ inputs.version }}-${{ matrix.rid }}.tar.gz

      - name: Smoke test archive
        if: runner.os == 'Windows' && matrix.smoke
        shell: pwsh
        run: ./.github/scripts/release/test-release-archive.ps1 artifacts/camp-${{ inputs.version }}-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: camp-${{ inputs.version }}-${{ matrix.rid }}
          path: |
            artifacts/camp-${{ inputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error
